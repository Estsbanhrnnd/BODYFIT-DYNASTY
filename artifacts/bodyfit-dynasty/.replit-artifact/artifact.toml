kind = "mobile"
previewPath = "/bodyfit-dynasty/"
title = "BodyFit Dynasty"
description = "Aplicación móvil premium de fitness, nutrición y comunidad para ayudar a las personas a entrenar, registrar su alimentación, seguir su progreso y mantenerse constantes."
version = "1.0.0"
id = "artifacts/bodyfit-dynasty"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/bodyfit-dynasty/" ]
localPort = 18592

[services.development]
run = "pnpm --filter @workspace/bodyfit-dynasty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bodyfit-dynasty", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bodyfit-dynasty", "run", "serve" ]

[services.env]
PORT = "18592"
BASE_PATH = "/bodyfit-dynasty/"
