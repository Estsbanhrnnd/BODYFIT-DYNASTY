openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Perfil y preferencias
  - name: community
    description: Publicaciones de la comunidad
  - name: store
    description: Catálogo de productos
  - name: activity
    description: Entrenamientos y progreso
  - name: admin
    description: Operaciones exclusivas del dueño
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile/me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Obtener o crear el perfil de la cuenta autenticada
      responses:
        "200":
          description: Perfil actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateMyProfile
      tags: [profile]
      summary: Actualizar datos y preferencias del perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "409":
          description: El nombre de usuario ya está ocupado
  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: Listar publicaciones recientes
      responses:
        "200":
          description: Feed de la comunidad
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityPost"
                required: [posts]
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Crear una publicación de texto o enlace público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostCreate"
      responses:
        "201":
          description: Publicación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
  /community/posts/{postId}/likes:
    post:
      operationId: toggleCommunityPostLike
      tags: [community]
      summary: Dar o quitar me gusta en una publicación
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  likeCount:
                    type: number
                required: [liked, likeCount]
  /community/posts/{postId}/comments:
    get:
      operationId: listCommunityPostComments
      tags: [community]
      summary: Listar comentarios de una publicación
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comentarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunityComment"
                required: [comments]
    post:
      operationId: createCommunityPostComment
      tags: [community]
      summary: Comentar una publicación
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityCommentCreate"
      responses:
        "201":
          description: Comentario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityComment"
  /store/products:
    get:
      operationId: listStoreProducts
      tags: [store]
      summary: Listar productos activos sin mostrar precios
      responses:
        "200":
          description: Catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreProduct"
                required: [products]
  /admin/store/products:
    get:
      operationId: listAdminStoreProducts
      tags: [admin]
      summary: Listar todos los productos para su administración
      responses:
        "200":
          description: Catálogo administrativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/StoreProduct"
                required: [products]
    post:
      operationId: createStoreProduct
      tags: [admin]
      summary: Crear un producto sin asignar precio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreProductInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
  /admin/store/products/{productId}:
    patch:
      operationId: updateStoreProduct
      tags: [admin]
      summary: Actualizar descripción, categoría o estado de un producto
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
    delete:
      operationId: deleteStoreProduct
      tags: [admin]
      summary: Eliminar un producto
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Producto eliminado
  /activity/workouts:
    get:
      operationId: listWorkoutLogs
      tags: [activity]
      summary: Obtener los entrenamientos recientes de la cuenta
      responses:
        "200":
          description: Entrenamientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  workouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutLog"
                required: [workouts]
    post:
      operationId: createWorkoutLog
      tags: [activity]
      summary: Guardar un entrenamiento completado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutLogCreate"
      responses:
        "201":
          description: Entrenamiento guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutLog"
  /progress/daily:
    put:
      operationId: saveDailyProgress
      tags: [activity]
      summary: Guardar el resumen diario de actividad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyProgress"
      responses:
        "200":
          description: Resumen guardado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyProgress"
  /progress/monthly:
    get:
      operationId: getMonthlyProgress
      tags: [activity]
      summary: Consultar historial mensual
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}$"
      responses:
        "200":
          description: Actividad del mes
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      $ref: "#/components/schemas/DailyProgress"
                  workouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutLog"
                required: [days, workouts]
  /admin/users/search:
    get:
      operationId: searchUserByCode
      tags: [admin]
      summary: Buscar una cuenta por su código único
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 24
      responses:
        "200":
          description: Cuenta encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummary"
        "404":
          description: No se encontró un usuario con ese código
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      properties:
        userId: { type: string }
        userCode: { type: string }
        displayName: { type: string }
        username: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
        themeKey: { type: string }
        fitnessGoal: { type: [string, "null"] }
        fitnessLevel: { type: [string, "null"] }
        activities: { type: array, items: { type: string } }
        otherActivity: { type: [string, "null"] }
        trainingLocation: { type: [string, "null"] }
        trainingPreferences: { type: array, items: { type: string } }
        preferredMacros: { type: array, items: { type: string } }
        logoKey: { type: string }
        onboardingComplete: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [userId, userCode, displayName, username, avatarUrl, themeKey, fitnessGoal, fitnessLevel, activities, otherActivity, trainingLocation, trainingPreferences, preferredMacros, logoKey, onboardingComplete, createdAt, updatedAt]
    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, minLength: 3, maxLength: 24 }
        avatarUrl: { type: [string, "null"], maxLength: 2048 }
        themeKey: { type: string }
        fitnessGoal: { type: [string, "null"] }
        fitnessLevel: { type: [string, "null"] }
        activities: { type: array, items: { type: string }, maxItems: 30 }
        otherActivity: { type: [string, "null"], maxLength: 80 }
        trainingLocation: { type: [string, "null"], enum: [gym, home, null] }
        trainingPreferences: { type: array, items: { type: string }, maxItems: 30 }
        preferredMacros: { type: array, items: { type: string }, minItems: 1, maxItems: 4 }
        logoKey: { type: string }
        onboardingComplete: { type: boolean }
    CommunityPostCreate:
      type: object
      properties:
        postType: { type: string, enum: [progress, routine, workout, meal, recipe, other] }
        caption: { type: string, minLength: 1, maxLength: 2000 }
        mediaUrl: { type: [string, "null"], maxLength: 2048 }
      required: [postType, caption]
    CommunityPost:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: [string, "null"] }
        displayName: { type: string }
        avatarUrl: { type: [string, "null"] }
        postType: { type: string }
        caption: { type: string }
        mediaUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        likeCount: { type: number }
        commentCount: { type: number }
        liked: { type: boolean }
      required: [id, userId, username, displayName, avatarUrl, postType, caption, mediaUrl, createdAt, likeCount, commentCount, liked]
    CommunityCommentCreate:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }
      required: [body]
    CommunityComment:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        username: { type: [string, "null"] }
        displayName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, userId, username, displayName, body, createdAt]
    StoreProduct:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        imageUrl: { type: [string, "null"] }
        priceCents: { type: [number, "null"] }
        promoText: { type: [string, "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, name, description, category, imageUrl, priceCents, promoText, active, createdAt, updatedAt]
    StoreProductInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        category: { type: string, minLength: 1, maxLength: 80 }
        imageUrl: { type: [string, "null"], maxLength: 2048 }
        active: { type: boolean }
      required: [name, description, category]
    WorkoutLogCreate:
      type: object
      properties:
        routineName: { type: string, minLength: 1, maxLength: 120 }
        location: { type: string, enum: [gym, home] }
        durationMinutes: { type: number, minimum: 1, maximum: 600 }
        completedAt: { type: string, format: date-time }
      required: [routineName, location, durationMinutes]
    WorkoutLog:
      allOf:
        - $ref: "#/components/schemas/WorkoutLogCreate"
        - type: object
          properties:
            id: { type: string }
            userId: { type: string }
          required: [id, userId, routineName, location, durationMinutes, completedAt]
    DailyProgressValues:
      type: object
      properties:
        calories: { type: number, minimum: 0 }
        protein: { type: number, minimum: 0 }
        carbs: { type: number, minimum: 0 }
        fats: { type: number, minimum: 0 }
        water: { type: number, minimum: 0 }
        steps: { type: number, minimum: 0 }
        burned: { type: number, minimum: 0 }
      required: [calories, protein, carbs, fats, water, steps, burned]
    DailyProgress:
      type: object
      properties:
        day: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        values:
          $ref: "#/components/schemas/DailyProgressValues"
      required: [day, values]
    AdminUserSummary:
      type: object
      properties:
        userCode: { type: string }
        username: { type: [string, "null"] }
        displayName: { type: string }
        fitnessGoal: { type: [string, "null"] }
        fitnessLevel: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [userCode, username, displayName, fitnessGoal, fitnessLevel, createdAt]

